name: Viral Puzzle Engine Automation

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Daily Posting Slot (1 to 5)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
      mode:
        description: "Execution Mode (render or publish)"
        required: true
        default: "publish"
        type: choice
        options:
          - "publish"
          - "render"
      page:
        description: "Target Page Key (or 'all' for all 8 Facebook pages)"
        required: false
        default: "all"
        type: string

  schedule:
    # 5 Daily Slots in UTC:
    # Slot 1: 08:00 UTC
    - cron: '0 8 * * *'
    # Slot 2: 12:00 UTC
    - cron: '0 12 * * *'
    # Slot 3: 16:00 UTC
    - cron: '0 16 * * *'
    # Slot 4: 20:00 UTC
    - cron: '0 20 * * *'
    # Slot 5: 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  run-puzzles:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Slot and Parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ github.event.inputs.slot }}"
            MODE="${{ github.event.inputs.mode }}"
            PAGE="${{ github.event.inputs.page }}"
          else
            HOUR=$(date -u +"%H")
            case "$HOUR" in
              08) SLOT="1" ;;
              12) SLOT="2" ;;
              16) SLOT="3" ;;
              20) SLOT="4" ;;
              00|*) SLOT="5" ;;
            esac
            MODE="publish"
            PAGE="all"
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "page=$PAGE" >> $GITHUB_OUTPUT
          echo "Executing Slot $SLOT | Mode: $MODE | Page: $PAGE"

      - name: Run Viral Puzzle Matrix
        env:
          FACEBOOK_PAGES_JSON: ${{ secrets.FACEBOOK_PAGES_JSON }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ steps.params.outputs.page }}" = "all" ]; then
            python master_runner.py --slot ${{ steps.params.outputs.slot }} --mode ${{ steps.params.outputs.mode }}
          else
            python master_runner.py --slot ${{ steps.params.outputs.slot }} --mode ${{ steps.params.outputs.mode }} --page ${{ steps.params.outputs.page }}
          fi
